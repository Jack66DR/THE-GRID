name: Build THE GRID

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DTHEGRID_BUILD_TESTS=ON

      - name: Build AU, VST3 and the engine test
        run: cmake --build build --config Release --target THEGRID_AU THEGRID_VST3 THEGRID_Test -j 4

      - name: Run offline engine test
        run: ./build/THEGRID_Test_artefacts/Release/THEGRID_Test

      - name: Sign (ad hoc) and zip
        run: |
          ART=build/THEGRID_artefacts/Release
          codesign --force --deep --sign - "$ART/AU/THE GRID.component"
          codesign --force --deep --sign - "$ART/VST3/THE GRID.vst3"
          mkdir -p dist
          ditto -c -k --keepParent "$ART/AU/THE GRID.component" dist/THE-GRID-AU.zip
          ditto -c -k --keepParent "$ART/VST3/THE GRID.vst3" dist/THE-GRID-VST3.zip

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: THE-GRID-macOS
          path: dist/*.zip

      - name: Validate AU with auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/THEGRID_artefacts/Release/AU/THE GRID.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumi Tgrd Mnrs
